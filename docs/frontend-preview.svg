<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f2f6ff" />
      <stop offset="100%" stop-color="#e9f0ff" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7f9ff" />
      <stop offset="100%" stop-color="#edf2ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#9ab6ff" flood-opacity="0.25" />
    </filter>
    <style>
      .title { font: 600 28px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #4c5ccf; }
      .subtitle { font: 600 16px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #6d789b; }
      .label { font: 600 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #7c84a6; }
      .value { font: 600 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #556088; }
      .muted { font: 600 13px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #b0b6d4; }
      .pill { font: 600 12px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #5d66b1; }
      .button-text { font: 700 14px 'Inter', 'Segoe UI', Arial, sans-serif; fill: #ffffff; }
    </style>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)" />
  <rect x="36" y="20" width="1208" height="84" rx="18" fill="url(#card)" filter="url(#shadow)" />
  <text x="64" y="70" class="title">Plataforma inteligente · RAG-COM</text>
  <rect x="972" y="36" width="220" height="48" rx="24" fill="#eef2ff" stroke="#d9e0ff" />
  <circle cx="994" cy="60" r="8" fill="#7a8bff" />
  <text x="1010" y="65" class="pill">Operaciones seguras y auditables</text>
  <text x="64" y="104" class="subtitle">Consulta procedimientos por cliente con contexto trazable.</text>

  <rect x="64" y="140" width="1152" height="420" rx="22" fill="url(#card)" filter="url(#shadow)" />
  <rect x="96" y="176" width="620" height="348" rx="18" fill="#ffffff" stroke="#e1e8ff" />
  <text x="120" y="212" class="subtitle">Asistente</text>
  <text x="120" y="242" class="label">Cliente</text>
  <rect x="120" y="254" width="280" height="44" rx="12" fill="#f5f7ff" stroke="#dfe5ff" />
  <text x="140" y="282" class="value">Selecciona un cliente</text>
  <text x="120" y="322" class="label">Pregunta</text>
  <rect x="120" y="334" width="560" height="110" rx="12" fill="#f5f7ff" stroke="#dfe5ff" />
  <text x="140" y="366" class="value">Ej: ¿Cuál es el horario de mantenimiento de ACME?</text>
  <rect x="120" y="468" width="130" height="48" rx="12" fill="#6f7dff" />
  <text x="154" y="497" class="button-text">Consultar</text>
  <rect x="270" y="468" width="130" height="48" rx="12" fill="#eef1ff" />
  <text x="314" y="497" class="pill">Limpiar</text>
  <text x="120" y="536" class="muted">Envía una consulta para ver resultados y contexto.</text>

  <rect x="754" y="176" width="430" height="348" rx="18" fill="#ffffff" stroke="#e1e8ff" />
  <text x="782" y="212" class="subtitle">Actividad</text>
  <text x="782" y="242" class="label">Historial de sesión</text>
  <text x="782" y="276" class="muted">Aún no hay preguntas en esta sesión.</text>
</svg>
