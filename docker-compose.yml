version: '3.9'
services:
  backend:
    build: ./backend
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs
      - backend_data:/app/chroma_db
    ports:
      - "8000:8000"
  frontend:
    build: ./frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  backend_data:
